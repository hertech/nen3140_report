<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meethulp NEN 3140</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meethulp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b5d6b">
<script>try{var _t=localStorage.getItem('meethulp-theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: instrument-panel list. Sticky header with deel/groep chips, step cards, fixed bottom tabs. */
:root{
  --bg:#efede5; --card:#fffdf8; --ink:#1c2326; --mut:#59646a; --line:#d6d2c5;
  --acc:#0b5d6b; --acc-ink:#ffffff; --accbg:#dcecee;
  --ok:#1b7a43; --okbg:#ddefe3; --bad:#b3261e; --badbg:#f8dedb; --warn:#7d5200; --warnbg:#f7ebc6;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181a; --card:#1b2326; --ink:#e7ecec; --mut:#9aa7ab; --line:#2f3b3f;
    --acc:#5bbccb; --acc-ink:#0b1a1d; --accbg:#1d3a40;
    --ok:#62c38a; --okbg:#173525; --bad:#ff8b80; --badbg:#3d1d1a; --warn:#e8c26a; --warnbg:#3a2f12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181a; --card:#1b2326; --ink:#e7ecec; --mut:#9aa7ab; --line:#2f3b3f;
  --acc:#5bbccb; --acc-ink:#0b1a1d; --accbg:#1d3a40;
  --ok:#62c38a; --okbg:#173525; --bad:#ff8b80; --badbg:#3d1d1a; --warn:#e8c26a; --warnbg:#3a2f12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em}
.save{font-size:12px;color:var(--mut);font-family:var(--f-mono)}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chiplbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-top:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;display:flex;align-items:center;gap:7px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.add{border-style:dashed;color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--acc-ink)}
main{padding:12px 16px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:10px}
.card h2 .n{font-family:var(--f-mono);font-size:12px;background:var(--accbg);color:var(--acc);border-radius:4px;padding:2px 7px;font-weight:500}
.card h2 .sp{flex:1}
h3{font-size:13px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.fld>span{font-weight:500}
.inp{display:flex;align-items:center;gap:6px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.inp em{font-style:normal;font-family:var(--f-mono);font-size:13px;color:var(--mut);min-width:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.m{border-top:1px solid var(--line);padding:12px 0 4px}
.m:first-of-type{border-top:0;padding-top:0}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mh b{font-weight:600}
.i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);background:transparent;font:italic 600 15px var(--f-body);cursor:pointer;flex:none}
.i[aria-expanded="true"]{background:var(--acc);color:var(--acc-ink)}
.info{background:var(--accbg);border-radius:8px;padding:12px;margin:2px 0 10px;display:flex;flex-direction:column;gap:10px}
.ih{font-weight:600;color:var(--acc)}
.fm{font-family:var(--f-mono);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap}
.lim{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{align-self:flex-start;background:none;border:0;color:var(--acc);font:inherit;font-size:13px;text-decoration:underline;padding:6px 0;cursor:pointer}
.res{margin-top:8px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px;min-height:22px}
.rl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cx{font-family:var(--f-mono);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.w{background:var(--warnbg);color:var(--warn)} .stbar{margin:6px 0 8px} .stbar .seg span{padding:8px 10px;font-size:14px;min-height:38px} .fld.need>span{color:var(--bad);font-weight:600} .fld.need textarea{border-color:var(--bad)}
.pill.n{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-height:48px;cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.chk span{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 14px;font-size:15px;min-height:42px;display:flex;align-items:center;cursor:pointer;color:var(--ink)}
.seg input:checked+span{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:1px}
.seg.bad input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.vis{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.vis:first-of-type{border-top:0;padding-top:0}
.vis p{margin:0;font-size:15px}
.vis .no{font-family:var(--f-mono);font-size:12px;color:var(--mut)}
.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);padding:11px 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.dangerx{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
details.card>summary{cursor:pointer;font-weight:600;font-size:16px;min-height:28px;list-style-position:inside}
details.card[open]>summary{margin-bottom:12px}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum div{flex:1;min-width:90px;border-radius:8px;padding:10px;font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line)}
.sum b{display:block;font:500 24px var(--f-mono);color:var(--ink)}
pre.rep{margin:0;font:12px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto}
.hint{font-size:13px;color:var(--mut);margin:0}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.tt{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:6px;overflow:hidden}
.tt th,.tt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
.tt th{background:var(--bg);font-weight:600}
.ico{display:block;color:var(--ink)}
.seg span.ty{flex-direction:column;gap:2px;padding:6px 12px;min-height:58px;justify-content:center}
.seg input:checked+span.ty .ico{color:var(--acc-ink)}
.ty b{font:500 13px var(--f-mono)}
.sbox{display:inline-block;border:1.5px solid var(--ink);padding:0 5px;font-weight:600;border-radius:2px;margin-left:4px}
.md h2{font-size:18px;margin:0 0 8px;text-transform:none;letter-spacing:0;color:var(--ink)}
.md h3{font-size:16px;margin:18px 0 4px;text-transform:none;letter-spacing:0;color:var(--acc);border-top:1px solid var(--line);padding-top:12px}
.md h4{font-size:13px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.md p{margin:6px 0}.md ul{margin:4px 0 8px;padding-left:20px}.md li{margin:3px 0}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md a{color:var(--acc)}
:root[data-theme="light"]{color-scheme:light}
#printroot{display:none}
@media print{body>*:not(#printroot){display:none!important}#printroot{display:block!important}html,body{background:#fff!important;margin:0!important;padding:0!important}#printroot .kr{max-width:none}}
@media (prefers-reduced-motion:no-preference){.info{animation:in .15s ease-out}@keyframes in{from{opacity:.3;transform:translateY(-4px)}}}
.menu{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.menu button[aria-current="page"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chipwrap{max-width:720px;margin:0 auto;padding:0 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:104px;display:flex;flex-direction:column;gap:4px;color:var(--ink);cursor:pointer}
.tile b{font:500 24px var(--f-mono);color:var(--acc)}
.tile span{font-weight:600}
.tile small{color:var(--mut);font-size:12px}
.vd{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.vd.on{background:#d32f2f}.vd.spl{background:#2e9e5b}.vd.unk{background:var(--line)}
.mhr{display:flex;align-items:center;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--mut)}
.pn{margin:0 0 6px}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.th{position:relative;display:inline-block}
.th img{display:block;width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.th .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
label.btn{display:inline-flex;align-items:center;gap:6px;position:relative}
.gal{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
.gal:first-of-type{border-top:0;padding-top:0}
.gal img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.gal .fld{flex:1}
canvas.sig{width:100%;height:130px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.svgst{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;width:100%;height:auto}
.vsw{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.vsw button{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--bg);color:var(--ink);padding:12px 8px;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.vsw button.on-spl{background:#2e9e5b;color:#fff}
.vsw button.on-on{background:#d32f2f;color:#fff}
.vsw button.on-spl .vd,.vsw button.on-on .vd{box-shadow:0 0 0 2px #fff}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Meethulp NEN 3140</h1><span style="display:flex;gap:10px;align-items:center"><span class="save" id="save">laden…</span><button class="chip" id="themebtn" data-act="theme" aria-label="Thema wisselen" style="min-height:34px;padding:5px 10px;font-size:13px">◐ Auto</button></span></div>
  <nav id="nav" class="menu" aria-label="Onderdelen"></nav>
</header>
<div id="chips" class="chipwrap"></div>
<main id="main"></main>

<script src="version.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))};
const fx=(x,d=2)=>(x==null||isNaN(x))?'–':Number(x).toLocaleString('nl-NL',{maximumFractionDigits:d});
const getP=(p,o=S)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(p,v)=>{const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v};
const pid=p=>'f-'+p.replace(/\W/g,'_');
const cmp=(v,f)=>isNaN(v)?null:!!f(v);

/* ---------- vaste lijsten ---------- */
const VIS=[
 'Gekozen maatregelen tegen elektrische schok (basis, fout en aanvullende bescherming) in overeenstemming met de eisen',
 'Aanwezigheid van vereiste brandwerende afschermingen en andere voorzorgsmaatregelen tegen brandverspreiding en thermische invloeden',
 'Keuze van leidingen juist in verband met de hoogst toelaatbare stroom',
 'Juiste keuze en instelling van beveiligingstoestellen',
 'Juiste keuze, locatie, installatie en afstemming van de overspanningsafleiders',
 'Aanwezigheid van geschikte schakelaars en scheiders op de juiste plaatsen',
 'Keuze elektrisch materieel in overeenstemming met de uitwendige invloeden',
 'Juiste aanduiding van de nul en beschermingsleidingen',
 'Aanwezigheid van schema’s, tekeningen, waarschuwingsborden of andere aanduidingen (grondschema, installatieschema, stroomkringschema, groepenverklaring)',
 'Juiste aanduiding van stroomketens, beveiligingstoestellen tegen overstroom, kortsluitstroom, schakelaars, scheiders, aansluitklemmen, etc.',
 'Deugdelijkheid van de aansluitingen van de leidingen (voorschriften fabrikant), bijv. striplengte en aanhaalmoment',
 'Aanwezigheid en geschiktheid van beschermingsleidingen met inbegrip van vereffeningsleidingen en aanvullende vereffeningsleidingen',
 'Vereiste bereikbaarheid van materieel voor bediening, identificatie en onderhoud',
 'Maatregelen tegen aanwezige elektromagnetische verstoring',
 'Vereffening van aanraakbare vreemde geleidende delen',
 'Juiste keuze en installatie van de leidingsystemen'
];
const SPL=[
 '1. Vrijschakelen (uitschakelen)',
 '2. Beveiligen tegen herinschakelen (vergrendelen)',
 'Beproeving 1: meter testen op bekende spanning',
 '3. Spanningsloosheid vaststellen (duspol of tester, geen voltpen)',
 'Beproeving 2: meter opnieuw testen',
 '4. Aarden en kortsluiten (indien vereist)',
 '5. Naburige spanningvoerende delen afschermen'
];
const PRESETS=['Hoofdmeterkast','Onderverdeelkast','Paddenstoel tent','Generator'];

const INFO={
 spl:{title:'Spanningsloos maken en vergrendelen',
  text:'Installatie spanningsloos maken met de vijf stappen en de 2 beproevingen uit je cursus. Eerst vrijschakelen en vergrendelen, dan met een tester of duspol vaststellen dat er geen spanning staat. Test de meter vóór en ná op een bekende spanning.\n\nLet op: de volgorde en de omschrijving van de twee beproevingen heb ik zelf ingevuld. Controleer ze met je cursusboek en pas deze tekst aan.'},
 rlo:{title:'R low: onderbroken zijn van geleiders',formula:'R = ρ × L / A\nρ koper ≈ 0,0175 Ω·mm²/m (20 °C)',
  fields:[{label:'Max. weerstand',p:'limits.rlo',unit:'Ω'}],
  extra:()=>`<div class="lim">${fld('Lengte L','limits.L',{unit:'m',mode:'decimal'})}${fld('Doorsnede A','limits.A',{unit:'mm²',mode:'decimal'})}${fld('ρ','limits.rho',{unit:'Ω·mm²/m',mode:'decimal'})}</div><div class="cx" id="rlcalc"></div>`,
  text:'Controle dat de verbindingen van een geleider goed zijn. Spanningsloos meten met minimaal 200 mA, van hoofdaardrail naar eindpunt.\n\nGrenswaarde volgens je blad: 1 Ω, afhankelijk van lengte en doorsnede van de geleider. Het gaat vooral om de vereffeningsleidingen, en eventueel de beschermingsleidingen voor zover die niet gemeten worden met de Zs-meting.\n\nGebruik de rekenhulp hierboven voor een lange kabel: de gemeten waarde moet dichtbij de berekende liggen.'},
 riso:{title:'R iso: isolatieweerstand',formula:'R_iso ≥ grens (MΩ)\n500 V testspanning, tussen alle geleiders',
  fields:[{label:'Nieuwe installatie',p:'limits.riso.nieuw',unit:'MΩ'},{label:'Bestaande installatie',p:'limits.riso.bestaand',unit:'MΩ'},{label:'SELV/PELV (250 V)',p:'limits.riso.selv',unit:'MΩ'}],
  text:'Meet de isolatieweerstand van de geleiders met afgekoppelde verbruikers (stekkers eruit, verlichting afgekoppeld of uitgeschakeld). Meet met 500 V testspanning bij gewone installaties. Bij gevaar voor schade aan apparatuur mag je met 250 V meten.\n\nNieuwe installaties: minimaal 1 MΩ. Bestaande installaties: minimaal 0,23 MΩ (zo staat het op je blad).\n\nDe waarde 0,5 MΩ voor SELV/PELV is uit mijn hoofd, niet van je blad. Controleer die in je boek.\n\nBij drie fasen meet je ook tussen de fasen onderling. De verwijzing naar NEN 1010 bepaling 61.3.3 komt uit je wensenlijst en is niet door mij gecontroleerd.'},
 scheid:{title:'Scheiding van stroomketens',
  text:'Controle dat stroomketens (groepen) niet onderling verbonden zijn, bijvoorbeeld door een gedeelde nul of een verkeerd aangesloten leiding.\n\nDit onderdeel staat niet op je blad met grenswaarden. Mijn uitleg hier is een eerste lezing van de rapporttitel. Vul aan met wat je docent zegt.'},
 zi:{title:'Zi: circuitimpedantie (fase-nul, fase-fase)',formula:'Zi_max = U0 / Ia\nIa = k × In (B: 5, C: 10, D: 20)\nVoorbeeld B16: Ia = 5 × 16 = 80 A, Zi_max = 230 / 80 = 2,88 Ω',
  fields:[{label:'k voor B',p:'limits.mult.B'},{label:'k voor C',p:'limits.mult.C'},{label:'k voor D',p:'limits.mult.D'}],
  text:'Circuitimpedantie voor kortsluiting tussen actieve geleiders (fase-nul of fase-fase). Moet lager zijn dan 230 V / Ik. Ik is de kortsluitstroom die nodig is om de installatieautomaat tijdig uit te laten schakelen.\n\nB-karakteristiek = 5 × In, C = 10 × In, D = 20 × In.\n\nBij een generator is de kortsluitstroom lager dan bij het net. Gebruik de echte generatorgegevens en controleer of de beveiliging snel genoeg uitschakelt. Dit laatste is mijn aanvulling, niet van je blad.'},
 zs:{title:'Zs: circuitimpedantie fase-aarde',formula:'Zs_max = U0 / Ia (zelfde grens als Zi)\nMet aardlek (cursus): Zs ≤ U / IΔn\n300 mA: 50 / 0,3 = 166 Ω',

function merge(base,src){ // vul ontbrekende velden aan uit defaults
  if(Array.isArray(base)||base===null||typeof base!=='object')return src===undefined?base:src;
  const o=Array.isArray(src)?src:Object.assign({},base);
  if(src&&typeof src==='object'){for(const k of Object.keys(src)){o[k]=(k in base&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))?merge(base[k],src[k]):src[k]}}
  return o;
}
function normalize(){
  S.cur=S.cur||{tab:'start',s:0,g:0,mv:'meet'};
  if(S.cur.tab==='aarding'){S.cur.tab='meten';S.cur.mv='ra'}
  if(!S.cur.mv)S.cur.mv='meet';
  const F=S.fixed,I=S.info;
  if(!F.insp&&I.insp)F.insp=I.insp;
  if(!F.bedrijf&&I.ing)F.bedrijf=I.ing;
  if(!F.adres&&I.ina)F.adres=I.ina;
  if(!F.contact&&I.inc)F.contact=I.inc;
  S.photos=S.photos||[];S.gebr=S.gebr||[];S.gdis=S.gdis||[];
  S.secs.forEach(s=>{
    if(!s.type)s.type='installatie';
    s.stt=Object.assign({draai:'',func:''},s.stt||{});s.rsn=Object.assign({draai:'',func:''},s.rsn||{});
    while(s.spl.length<SPL.length)s.spl.push(false);
    while(s.vis.length<VIS.length)s.vis.push({a:'',t:''});
    s.groups=(s.groups&&s.groups.length)?s.groups:[newGrp('Groep 1')];
    s.groups=s.groups.map(g=>merge(newGrp(),g));
  });
  S.gebr.forEach(x=>{if(!x.urg)x.urg=(x.src&&/^(m|s|ra):/.test(x.src))?'urgent':'aanbevolen'});
  if(!S.secs.length)S.secs=[newSec('Hoofdmeterkast','1')];
  S.cur.s=Math.min(S.cur.s||0,S.secs.length-1);
  S.cur.g=Math.min(S.cur.g||0,S.secs[S.cur.s].groups.length-1);
}

/* ---------- foto's ---------- */
const PH={};
const phKey=id=>'meethulp-ph-'+id;
let dbCol=null;const unsynced=[];
/* IndexedDB: store 'kv' (staat) en store 'photos' (foto's als data-URL) */
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('geen indexedDB'));
  const r=indexedDB.open('meethulp',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('geblokkeerd'));
})}
const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{
  if(!idb)return rej(new Error('geen idb'));
  try{const tx=idb.transaction(store,mode);const rq=fn(tx.objectStore(store));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}
});
const idbGet=(st,k)=>idbReq(st,'readonly',o=>o.get(k));
const idbPut=(st,k,v)=>idbReq(st,'readwrite',o=>o.put(v,k));
const idbDel=(st,k)=>idbReq(st,'readwrite',o=>o.delete(k));
function savePhoto(id){
  idbPut('photos',id,PH[id]).then(()=>{try{localStorage.removeItem(phKey(id))}catch(e){}}).catch(()=>{try{localStorage.setItem(phKey(id),PH[id])}catch(e){}});
  if(dbCol){try{dbCol.doc('ph-'+id).set({d:PH[id]}).catch(()=>{})}catch(e){}}else unsynced.push(id);
}
function dropPhotoStore(id){
  idbDel('photos',id).catch(()=>{});
  try{localStorage.removeItem(phKey(id))}catch(e){}
  if(dbCol){try{const d=dbCol.doc('ph-'+id);if(d.delete)d.delete().catch(()=>{})}catch(e){}}
  delete PH[id];
}
async function loadPhotos(){
  let changed=false;
  for(const p of S.photos){
    if(PH[p.id])continue;
    let v=null;
    if(idb){try{v=await idbGet('photos',p.id)}catch(e){}}
    if(!v){ // oude opslag: verhuis naar IndexedDB
      try{const l=localStorage.getItem(phKey(p.id));if(l){v=l;if(idb)idbPut('photos',p.id,l).then(()=>{try{localStorage.removeItem(phKey(p.id))}catch(e){}}).catch(()=>{})}}catch(e){}
    }
    if(v){PH[p.id]=v;changed=true;continue}
    if(dbCol){dbCol.doc('ph-'+p.id).get().then(sn=>{if(sn.exists&&sn.data()&&sn.data().d){PH[p.id]=sn.data().d;idbPut('photos',p.id,PH[p.id]).catch(()=>{});render()}}).catch(()=>{})}
  }
  return changed;
}
function readImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};fr.readAsDataURL(file)})}
async function addPhoto(ref,file){
  try{
    const im=await readImg(file);
    const sc=Math.min(1,800/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let q=.6,url=c.toDataURL('image/jpeg',q);
    while(url.length>170000&&q>.3){q-=.1;url=c.toDataURL('image/jpeg',q)}
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    PH[id]=url;S.photos.push({id,ref,cap:''});savePhoto(id);touch();render();
  }catch(e){ui.msg='Foto toevoegen lukte niet.';render()}
}

function stelselSVG(t){

  const tx=(x,y,s,sz)=>`<text x="${x}" y="${y}" font-size="${sz||10}" fill="currentColor" text-anchor="middle" font-family="IBM Plex Mono,monospace">${s}</text>`;
  const earth=(x,y)=>`<path d="M${x} ${y} v10 M${x-10} ${y+10} h20 M${x-6} ${y+14} h12 M${x-2} ${y+18} h4" ${w}/>`;
  const ln=(y,x1,x2,lab)=>`<path d="M${x1} ${y} H${x2}" ${w}/>${tx((x1+x2)/2,y-5,lab)}`;
  let s=`<rect x="10" y="16" width="52" height="92" rx="4" ${w}/>${tx(36,66,'bron')}<rect x="250" y="16" width="60" height="92" rx="4" ${w}/>${tx(280,66,'verbruiker',9)}`;
  const srcEarth=`<path d="M36 108 v0" ${w}/>${earth(36,108)}${tx(36,142,'aarde bron',9)}`;
  const tie=`<path d="M72 58 V88" ${w}/><circle cx="72" cy="58" r="2.5" fill="currentColor"/><circle cx="72" cy="88" r="2.5" fill="currentColor"/>`;
  if(t==='TT')s+=ln(34,62,250,'L')+ln(58,62,250,'N')+srcEarth+earth(280,108)+tx(280,142,'eigen aarde',9);
  else if(t==='TN-S')s+=ln(34,62,250,'L')+ln(58,62,250,'N')+ln(88,62,250,'PE')+tie+srcEarth;
  else if(t==='TN-C')s+=ln(34,62,250,'L')+ln(66,62,250,'PEN')+srcEarth;
  else if(t==='TN-C-S')s+=ln(34,62,250,'L')+ln(70,62,150,'PEN')+ln(58,150,250,'N')+ln(88,150,250,'PE')+`<path d="M150 58 V88" ${w}/><circle cx="150" cy="70" r="2.5" fill="currentColor"/>`+srcEarth;

/* ---------- berekeningen ---------- */
function zrefInfo(g){
  const x=num(S.zref);if(!isNaN(x))return {v:x,src:'ingevuld'};
  const g0=S.secs[0]&&S.secs[0].groups[0];
  if(g0){const ks=g0.ph==='3'?['zi','zi2','zi3']:['zi'];const v=ks.map(k=>num(g0.m[k])).filter(a=>!isNaN(a));if(v.length)return {v:Math.max(...v),src:'overgenomen uit Zi van '+S.secs[0].name+' / '+g0.name}}
  const o=num(g&&g.zref);if(!isNaN(o))return {v:o,src:'uit eerdere invoer'};
  return {v:0,src:'niet ingevuld (0 Ω)'};
}
const sk=k=>/^riso/.test(k)?'riso':/^rcdt/.test(k)?'rcdt':k;
function effSt(g,key){
  const k=sk(key);
  if(['rloL','rloP','riso','scheid'].includes(k)&&g.stBlock)return {st:g.stBlock,rsn:g.rsnBlock||''};
  return {st:(g.stt&&g.stt[k])||'',rsn:(g.rsn&&g.rsn[k])||''};
}
const SROW=(key,label,e)=>({key,label,val:'',unit:'',limT:'',ok:null,calc:'',det:'',status:e.st,rsn:e.rsn});
function rowsFor(s,g){
  const out=[],seen={};
  rowsFor0(s,g).forEach(r=>{
    const k=sk(r.key),e=effSt(g,r.key);
    if(!e.st){out.push(r);return}
    if(seen[k])return;seen[k]=1;
    out.push(SROW(k,k==='riso'?'Isolatieweerstand':k==='rcdt'?'Aanspreektijd RCD-t':r.label,e));
  });
  return out;
}
function rowsFor0(s,g){
  const L=S.limits,m=g.m,r=[];
  const R=(key,label,val,unit,limT,ok,calc,det)=>r.push({key,label,val,unit,limT,ok,calc:calc||'',det:det||''});
  const ph3=g.ph==='3';
  const lim=num(L.rlo);
  ['rloL','rloP'].forEach(k=>{const v=num(m[k]);R(k,k==='rloL'?'R low leidingen':'R low potentiaalvereffening en aarding',m[k],'Ω',`≤ ${fx(lim)} Ω`,isNaN(lim)?null:cmp(v,x=>x<=lim))});
  const rl=num(L.riso[m.risoMode]);
  const rk=[['riso',ph3?'L–PE':'L–PE'],['risoN','N–PE'],['risoLN','L–N']];
  if(ph3)rk.push(['risoL12','L1–L2'],['risoL13','L1–L3'],['risoL23','L2–L3']);
  rk.forEach(([k,l],i)=>{
    if(i>0&&m[k]==='')return;
    R(k,'Isolatieweerstand '+l,m[k],'MΩ',`≥ ${fx(rl,3)} MΩ (${({nieuw:'nieuw',bestaand:'bestaand',selv:'SELV/PELV'})[m.risoMode]})`,isNaN(rl)?null:cmp(num(m[k]),x=>x>=rl));
  });
  R('scheid','Scheiding van stroomketens',m.scheid==='ok'?'akkoord':m.scheid==='nok'?'niet akkoord':'','',m.scheid?'':'', m.scheid?m.scheid==='ok':null);
  const k=num(L.mult[g.ba]),In=num(g.in),u0=num(g.u0)||230;
  const zmax=(k>0&&In>0)?u0/(k*In):NaN;
  const zc=isNaN(zmax)?'':`Zmax = ${fx(u0,0)} / (${fx(k,0)} × ${fx(In)}) = ${fx(zmax)} Ω`;
  const keys=b=>ph3?[b,b+'2',b+'3']:[b];
  const worst=b=>{const v=keys(b).map(x=>num(m[x])).filter(x=>!isNaN(x));return v.length?Math.max(...v):NaN};
  const det=b=>ph3?keys(b).map((x,i)=>`L${i+1} ${m[x]===''?'–':m[x]}`).join(' / '):'';
  const zi=worst('zi'),zs=worst('zs');
  R('zi',ph3?'Circuitimpedantie Zi (slechtste van L1–L3)':'Circuitimpedantie Zi',isNaN(zi)?'':fx(zi,3),'Ω',`≤ ${fx(zmax)} Ω`,isNaN(zmax)?null:cmp(zi,x=>x<=zmax),zc,det('zi'));
  const idn=num(g.idn),vt=num(L.vt);
  const alt=(g.rcd&&idn>0&&vt>0)?vt/(idn/1000):NaN;
  let zlim=`≤ ${fx(zmax)} Ω`;if(!isNaN(alt))zlim+=` (of ≤ ${fx(alt,0)} Ω met aardlek ${fx(idn,0)} mA)`;
  R('zs',ph3?'Circuitimpedantie Zs (slechtste van L1–L3)':'Circuitimpedantie Zs',isNaN(zs)?'':fx(zs,3),'Ω',zlim,(isNaN(zmax)&&isNaN(alt))?null:cmp(zs,x=>(!isNaN(zmax)&&x<=zmax)||(!isNaN(alt)&&x<=alt)),zc,det('zs'));
  const zrI=zrefInfo(g);const zr=zrI.v;let pct=NaN,uv=NaN;
  const zdu=!isNaN(num(m.duZ))?num(m.duZ):zi;
  if(!isNaN(zdu)&&In>0){uv=(zdu-zr)*In;pct=uv/u0*100}else if(!isNaN(num(m.duPct)))pct=num(m.duPct);
  const dl=num(L.du[g.dutype]);
  R('du','Spanningsverlies ΔU',isNaN(pct)?'':fx(pct,2),'%',`≤ ${fx(dl)} % (${({licht:'verlichting',overig:'overige groepen',pv:'PV/omvormer'})[g.dutype]})`,isNaN(dl)?null:cmp(pct,x=>x<=dl),isNaN(uv)?'':`Uv = (${fx(zdu)} − ${fx(zr)}) × ${fx(In)} = ${fx(uv)} V → ${fx(pct)} % (Zref ${zrI.src})`);
  if(g.rcd){
    const rg=L.rcdI[g.rtype]||[NaN,NaN];const lo=num(rg[0]),hi=num(rg[1]);
    const okI=(idn>0&&!isNaN(lo)&&!isNaN(hi))?cmp(num(m.rcdI),x=>x>=lo*idn&&x<=hi*idn):null;
    R('rcdi','Aanspreekstroom RCD-I',m.rcdI,'mA',(idn>0)?`${fx(lo*idn)} – ${fx(hi*idn)} mA (type ${g.rtype}, IΔn ${fx(idn,0)} mA)`:'',okI);
    const tab=L.rcdtab[g.rS?'s':'n'];
    [['rcdt','Aanspreektijd RCD-t bij 1×IΔn','rcdT',0],['rcdt2','Aanspreektijd RCD-t bij 2×IΔn','rcdT2',1],['rcdt5','Aanspreektijd RCD-t bij 5×IΔn','rcdT5',2]].forEach(([key,label,mk,i])=>{
      if(i>0&&m[mk]==='')return;
      const tl=num(tab[i]);R(key,label,m[mk],'ms',`≤ ${fx(tl,0)} ms${g.rS?' (selectief)':''}`,isNaN(tl)?null:cmp(num(m[mk]),x=>x<=tl));
    });
    R('tk','Testknop RCD',({ok:'akkoord',second:'pas bij 2e keer',nok:'niet akkoord'})[m.tk]||'','','moet uitschakelen',m.tk?m.tk==='ok':null,m.tk==='second'?'Reageert pas bij de tweede keer: mechanisme mogelijk uitgedroogd. Noteer als afwijking.':'');
  }
  return r;
}
function secRows(s){return secRows0(s).map(r=>{const e=effSt(s,r.key);return e.st?SROW(r.key,r.label,e):r})}
function secRows0(s){
  const o=[];
  if(s.groups.some(g=>g.ph==='3'))o.push({key:'draai',label:'Draaiveld',val:s.draai,unit:'',limT:'1-2-3 rechtsom is goed',ok:s.draai?s.draai==='rechtsom':null,calc:'',det:''});
  o.push({key:'func',label:'Functionele beproeving',val:s.func==='ok'?'akkoord':s.func==='nok'?'niet akkoord':'',unit:'',limT:'',ok:s.func?s.func==='ok':null,calc:'',det:''});
  return o;
}

function aardRows(){
  const A=S.aarding;
  if(A.st)return [SROW('ra0','Aardverspreidingsweerstand RA',{st:A.st,rsn:A.rsn})];
  return aardRows0();
}
function aardRows0(){
  const A=S.aarding,L=S.limits,out=[];
  let lim=NaN,limT='';
  if(A.mode==='aardlek'){const i=num(A.idn);lim=i>0?50/(i/1000):NaN;limT=`≤ ${fx(lim,0)} Ω (50 V / ${fx(i,0)} mA)`}
  else if(A.mode==='automaat'){lim=num(L.ratab[A.tab]);limT=isNaN(lim)?'geen waarde in tabel':`≤ ${fx(lim)} Ω (${A.tab}, cursustabel)`}
  else{lim=num(A.eigen);limT=isNaN(lim)?'':`≤ ${fx(lim)} Ω`}
  const rh=num(L.rhulp);
  A.refs.forEach((r,i)=>{
    const n=i+1;
    out.push({key:'ra'+i,label:`Referentie ${n}: RA`,val:r.ra,unit:'Ω',limT,ok:isNaN(lim)?null:cmp(num(r.ra),x=>x<=lim),calc:''});
    out.push({key:'rh'+i,label:`Referentie ${n}: Rc / Rp`,val:(r.rc||'–')+' / '+(r.rp||'–'),unit:'Ω',limT:`< ${fx(rh,0)} Ω`,ok:(r.rc===''&&r.rp==='')?null:(isNaN(rh)?null:[r.rc,r.rp].filter(x=>x!=='').every(x=>num(x)<rh)),calc:''});
  });
  return out;
}
function allRows(s){const o=[];s.groups.forEach(g=>rowsFor(s,g).forEach(r=>o.push(r)));secRows(s).forEach(r=>o.push(r));return o}
function secStatus(s){
  const rows=allRows(s);const nee=s.vis.some(v=>v.a==='nee');
  if(nee||rows.some(r=>r.ok===false))return 'bad';
  if(rows.some(r=>r.ok===true))return 'ok';
  return '';
}
function grpStatus(s,g){const rows=rowsFor(s,g);if(rows.some(r=>r.ok===false))return 'bad';if(rows.some(r=>r.ok===true))return 'ok';return ''}
function counts(){
  let ok=0,bad=0,open=0,nu=0,nr=0;
  const add=r=>{if(r.status){if(r.status==='nu'){nu++;if(!r.rsn)nr++}return}if(r.ok===true)ok++;else if(r.ok===false)bad++;else open++};
  S.secs.forEach(s=>{allRows(s).forEach(add);s.vis.forEach(v=>{if(v.a==='nee')bad++;else if(v.a==='ja')ok++;else if(v.a==='')open++})});
  aardRows().forEach(r=>{if(r.status||r.ok!==null)add(r)});
  return {ok,bad,open,nu,nr};
}

/* ---------- gebreken ---------- */
const gid=()=>'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function gebrekCandidates(){
  const out=[];
  S.secs.forEach((s,si)=>{
    s.groups.forEach((g,gi)=>rowsFor(s,g).forEach(r=>{if(r.ok===false)out.push({src:`m:${si}:${gi}:${r.key}`,txt:`${s.name} / ${g.name}: ${r.label} ${r.val} ${r.unit} voldoet niet (grens ${r.limT}).`,maat:r.key==='tk'?'Aardlekschakelaar direct vervangen en de groep buiten dienst nemen.':'',norm:''})}));
    secRows(s).forEach(r=>{if(r.ok===false)out.push({src:`s:${si}:${r.key}`,txt:`${s.name}: ${r.label} ${r.val}.`,maat:'',norm:''})});
    s.vis.forEach((v,i)=>{if(v.a==='nee')out.push({src:`v:${si}:${i}`,txt:`${s.name}: visueel punt ${i+1} niet in orde: ${VIS[i]}.${v.t?' '+v.t:''}`,maat:'',norm:''})});
  });
  aardRows().forEach(r=>{if(r.ok===false)out.push({src:'ra:'+r.key,txt:`Aarding: ${r.label} ${r.val} ${r.unit} voldoet niet (grens ${r.limT}).`,maat:'',norm:''})});
  return out;
}
const pendingGebr=()=>gebrekCandidates().filter(c=>!S.gebr.some(x=>x.src===c.src)&&!S.gdis.includes(c.src));
function fillGebr(){const p=pendingGebr();p.forEach(c=>S.gebr.push({id:gid(),src:c.src,txt:c.txt,maat:c.maat,norm:c.norm,urg:/^(m|s|ra):/.test(c.src)?'urgent':'aanbevolen'}));if(p.length)touch();return p.length}

function ktSt(r){
  if(r.status==='nu')return ['Niet uitgevoerd','w'];
  if(r.status==='nvt')return ['Niet van toepassing','n'];

  if(r.ok===false)return ['Voldoet niet','bad'];
  return ['Niet gemeten','n'];
}
function ktTable(rows){
  const rs=rows.filter(r=>r.status||(r.val!==''&&r.val!=null)||r.ok!==null);
  if(!rs.length)return '<p>Geen metingen ingevuld.</p>';
  return `<table><tr><th>Meting</th><th>Gemeten</th><th>Grens</th><th>Uitslag</th></tr>${rs.map(r=>{
    const [t,c]=ktSt(r);
    const val=r.status?'–':esc((r.val===''?'–':r.val)+(r.unit?' '+r.unit:'')+(r.det?' ('+r.det+')':''));
    const extra=r.status&&r.rsn?`<small>${esc(r.rsn)}</small>`:((r.status==='nu'&&!r.rsn)?'<small>reden niet ingevuld</small>':'');
    return `<tr><td>${esc(r.label)}<small>${esc(UITL[bk(r.key)]||'')}</small></td><td>${val}</td><td>${esc(r.limT||'–')}</td><td class="st ${c}">${t}${extra}</td></tr>`}).join('')}</table>`;
}

/* ---------- changelog (CHANGELOG.md, eenvoudige markdown) ---------- */
function mdInline(t){
  t=esc(t);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function mdRender(src){
  const out=[];let inUl=false,para=[];
  const flushP=()=>{if(para.length){out.push('<p>'+mdInline(para.join(' '))+'</p>');para=[]}};
  const closeUl=()=>{if(inUl){out.push('</ul>');inUl=false}};
  String(src).replace(/\r/g,'').split('\n').forEach(line=>{
    let m;
    if(/^\s*$/.test(line)){flushP();closeUl();return}
    if(/^\[[^\]]+\]:\s/.test(line))return;
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){flushP();closeUl();const n=Math.min(m[1].length+1,5);out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);return}
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){flushP();if(!inUl){out.push('<ul>');inUl=true}out.push('<li>'+mdInline(m[1])+'</li>');return}
    if(inUl&&/^\s{2,}\S/.test(line)){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,' '+mdInline(line.trim())+'</li>');return}
    closeUl();para.push(line.trim());
  });
  flushP();closeUl();
  return out.join('');
}
function viewChangelog(){
  if(!ui.cl){
    ui.cl={s:'load'};
    fetch('CHANGELOG.md').then(r=>{if(!r.ok)throw 0;return r.text()})
      .then(t=>{ui.cl={s:'ok',t};if(S.cur.tab==='changelog')render()})
      .catch(()=>{ui.cl={s:'err'};if(S.cur.tab==='changelog')render()});
  }
  const c=ui.cl;
  let body;
  if(c.s==='ok'){
    const m=c.t.match(/^##\s*\[(\d+\.\d+\.\d+)\]/m);
    const warn=(m&&m[1]!==APP_VERSION)?`<div class="warn" style="margin-bottom:10px">Let op: de changelog loopt tot versie ${esc(m[1])}, de app is ${esc(APP_VERSION)}. Een van de twee is niet bijgewerkt.</div>`:'';
    body=warn+`<div class="md">${mdRender(c.t)}</div>`;
  }else if(c.s==='err')body='<p class="hint">De changelog kon niet geladen worden. Dit lukt alleen als de app via https of vanaf de server is geopend.</p><button class="btn ghost sm" data-act="clretry">Opnieuw proberen</button>';
  else body='<p class="hint">Laden…</p>';
  return `<section class="card"><h2>Wat is nieuw<span class="sp"></span><span class="hint">Versie ${esc(APP_VERSION)}</span></h2>${body}</section>`;
}

function initSig(){
  const c=$('#sig');if(!c)return;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  if(S.sig){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=S.sig}
  ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,last=null;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{drawing=true;last=pos(e);try{c.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault()};
  const end=()=>{if(!drawing)return;drawing=false;S.sig=c.toDataURL('image/png');touch()};
  c.onpointerup=end;c.onpointercancel=end;
}

let dbDoc=null,saveTimer=null,saving=false,pending=false;
const setSave=t=>{const e=$('#save');if(e)e.textContent=t};
function touch(){S.t=Date.now();setSave('wijzigingen…');clearTimeout(saveTimer);saveTimer=setTimeout(persist,700)}
async function persist(){
  const json=JSON.stringify(S);
  let local=false;
  if(idb){try{await idbPut('kv','state',{json,t:S.t});local=true}catch(e){}}
  if(!local){try{localStorage.setItem(KEY,json);local=true}catch(e){}}
  if(!dbDoc){setSave(local?'bewaard op dit toestel':'NIET bewaard: opslag vol of geblokkeerd');return}
  if(saving){pending=true;return}
  saving=true;
  try{await dbDoc.set({json,t:S.t});setSave('opgeslagen')}
  catch(e){setSave(local?'bewaard op dit toestel':'NIET bewaard')}
  saving=false;
  if(pending){pending=false;persist()}
}
async function load(){
  try{idb=await idbOpen()}catch(e){idb=null}
  let found=false,migrated=false;
  if(idb){try{const r=await idbGet('kv','state');if(r&&r.json){S=merge(defaults(),JSON.parse(r.json));found=true}}catch(e){}}
  if(!found){try{const raw=localStorage.getItem(KEY);if(raw){S=merge(defaults(),JSON.parse(raw));migrated=true}}catch(e){}}
  normalize();S.cur.tab='start';
  await loadPhotos();render();
  setSave(idb?'bewaard op dit toestel':'bewaard (beperkte opslag)');
  if(migrated&&idb){try{await idbPut('kv','state',{json:JSON.stringify(S),t:S.t||0});localStorage.removeItem(KEY)}catch(e){}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbCol=db.collection('data/users/'+id);
    dbDoc=dbCol.doc('meethulp');
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.t||0)>(S.t||0)){const tb=S.cur.tab;S=merge(defaults(),JSON.parse(d.json));normalize();S.cur.tab=tb;render()}
    }
    unsynced.splice(0).forEach(pid=>{if(PH[pid]&&S.photos.some(p=>p.id===pid))dbCol.doc('ph-'+pid).set({d:PH[pid]}).catch(()=>{})});
    if(await loadPhotos())render();
    setSave('opgeslagen');
    if((S.t||0)>0)persist();
  }catch(e){dbDoc=null;dbCol=null;setSave(idb?'bewaard op dit toestel':'bewaard (beperkte opslag)')}
}

async function saveFile(name,data,msgEl){
  const say=t=>{if(msgEl)msgEl.textContent=t};
  try{
    if(window.claude&&window.claude.use){
      const d=await window.claude.use('downloads');
      if(d){await d.save({filename:name,data});say('Bewaard.');return}
    }
    const type=/\.html$/.test(name)?'text/html':'text/plain';
    const blob=new Blob([data],{type:type+';charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),15000);
    say('Bewaard (kijk in je downloads of Bestanden).');
  }catch(err){say((err&&err.code==='declined')?'Niet bewaard.':'Bewaren lukt hier niet. Gebruik Kopieer tekst.')}
}

  else if(a==='clretry'){ui.cl=null;render()}
  else if(a==='doupd'){if(ui.waiting){try{await persist()}catch(x){}ui.updating=true;ui.waiting.postMessage('SKIP_WAITING')}}
  else if(a==='chkupd'){
    if(!swReg){ui.msg='Updates controleren werkt alleen in de geïnstalleerde app of via https.';render();return}
    if(!navigator.onLine){ui.msg='Geen verbinding. Probeer het opnieuw met internet.';render();return}
    try{await swReg.update()}catch(x){}
    await new Promise(r=>setTimeout(r,1500));
    ui.msg=ui.waiting?'':'Je hebt de nieuwste versie ('+APP_VERSION+').';render()}
  else if(a==='pdf'){printReport()}
  else if(a==='install'){const ev=ui.installEvt;if(ev){ev.prompt();try{await ev.userChoice}catch(x){}ui.installEvt=null;render()}}
  else if(a==='savefile'){saveFile(fileName(),klantHTML(),$('#fmsg'))}
  else if(a==='copydata'){const m=$('#fmsg');try{await navigator.clipboard.writeText(dataJSON());if(m)m.textContent='Back-uptekst gekopieerd. Plak hem ergens veilig (notitie, mail aan jezelf).'}catch(err){const ta=$('#pastedata');if(m)m.textContent='Kopiëren lukte niet hier.'}}
  else if(a==='openpaste'){const ta=$('#pastedata');try{const o=parseData(ta.value);ui.pendingOpen={name:'geplakte tekst',o};render()}catch(err){ui.msg='Dit lijkt geen meethulp-back-up. Er is niets veranderd.';render()}}
  else if(a==='openok'){if(ui.pendingOpen){const o=ui.pendingOpen.o;ui.pendingOpen=null;applyData(o);ui.msg='Bestand geopend.';render()}}
  else if(a==='opencancel'){ui.pendingOpen=null;render()}
  else if(a==='sigclear'){S.sig='';touch();render()}
  else if(a==='copy'){
    const txt=reportText();const m=$('#rmsg');
    try{await navigator.clipboard.writeText(txt);if(m)m.textContent='Gekopieerd.'}
    catch(err){const r=document.createRange();r.selectNodeContents($('#rep'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);if(m)m.textContent='Kopiëren lukte niet. De tekst is geselecteerd, kopieer hem handmatig.'}}
  else if(a==='dl'){saveFile('meetrapport-'+new Date().toISOString().slice(0,10)+'.txt',reportText(),$('#rmsg'))}
  else if(a==='dlh'){saveFile('meetrapport-'+new Date().toISOString().slice(0,10)+'.html',reportHTML(),$('#rmsg'))}
});
let dlOk=true;function showDl(){dlOk=true;document.querySelectorAll('.dlb').forEach(x=>{x.hidden=false})}
document.addEventListener('focusin',()=>{
  if(S.cur.tab==='rapport'){const b=document.querySelector('.dlb');if(b&&b.hidden){window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{if(d)showDl()}).catch(()=>{})}}
});
applyTheme();
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='auto')applyTheme()})}catch(e){}}
try{const seen=localStorage.getItem(SEENKEY);if(seen&&seen!==APP_VERSION)ui.updated=seen;localStorage.setItem(SEENKEY,APP_VERSION)}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installEvt=e;if(S.cur.tab==='start')render()});
window.addEventListener('appinstalled',()=>{ui.installEvt=null;if(S.cur.tab==='start')render()});
let swReg=null;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      swReg=reg;
      const watch=w=>w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){ui.waiting=w;render()}});
      if(reg.waiting&&navigator.serviceWorker.controller){ui.waiting=reg.waiting;render()}
      reg.addEventListener('updatefound',()=>{if(reg.installing)watch(reg.installing)});
      reg.update().catch(()=>{});
      setInterval(()=>reg.update().catch(()=>{}),3600000);
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(ui.updating)location.reload()});
  });
}
load().then(()=>{
  if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d)showDl()}).catch(()=>{});
});
</script>
